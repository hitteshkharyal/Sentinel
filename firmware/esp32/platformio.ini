; ─────────────────────────────────────────────
; SENTINEL Firmware — PlatformIO Configuration
; ─────────────────────────────────────────────
; This will be the PlatformIO project configuration for ESP32.
; Full implementation in Day 14.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ; WiFi (built-in)
    ; MQTT - knolleary/PubSubClient
    knolleary/PubSubClient@^2.8
    ; JSON - bblanchon/ArduinoJson
    bblanchon/ArduinoJson@^7.0
    ; Sensor libraries will be added per sensor in Day 14
