version: '3.8'

# ─────────────────────────────────────────────
# SENTINEL — Hardened Production Overlay
# ─────────────────────────────────────────────

services:
  sentinel-mongo:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  sentinel-api:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  sentinel-web:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'
